spring:
  datasource:
    url: jdbc:h2:mem:lockerflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

lockerflow:
  expiration:
    scheduling-enabled: false
  security:
    jwt:
      # Test fixture only: a fixed Base64 value representing more than 256 bits.
      secret-base64: bG9ja2VyZmxvdy10ZXN0LW9ubHktand0LXNlY3JldC0zMi1ieXRlcy1taW5pbXVt
      issuer: lockerflow
      access-token-ttl: PT30M
